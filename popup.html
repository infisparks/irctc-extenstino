<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
  <title>IRCTC AutoFill Pros</title>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="brand">IRCTC</span> AutoFill Pros</h1>
      <p>Save up to 6 passengers for quick booking</p>
    </header>
    
    <div id="passenger-list">
      <!-- Passenger cards will be rendered here dynamically -->
    </div>
    
    <button id="add-passenger-btn" class="btn outline-dashed">+ Add Another Passenger</button>
    
    <div class="payment-settings">
      <header class="section-header">
        <h2>Payment Settings</h2>
      </header>
      <div class="form-group">
        <label>Payment Mode</label>
        <select id="payment-mode">
          <option value="">None</option>
          <option value="BHIM_UPI">BHIM/ UPI/ USSD</option>
        </select>
      </div>
      <div class="form-group">
        <label>Gateway / Bank</label>
        <select id="payment-gateway">
          <option value="">None</option>
          <option value="PAYTM">Pay using BHIM (Powered by PAYTM)</option>
        </select>
      </div>
      <div class="form-check">
        <input type="checkbox" id="auto-pay-book">
        <label for="auto-pay-book">Auto Click "Pay & Book"</label>
      </div>
    </div>
    
    <div class="actions">
      <button id="save-btn" class="btn primary">Save All Details</button>
    </div>
    <div id="status-msg" class="status hidden"></div>
  </div>
  
  <template id="passenger-template">
    <div class="passenger-card">
      <div class="card-header">
        <span class="passenger-title">Passenger</span>
        <button class="remove-btn" title="Remove Passenger">✕</button>
      </div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" class="p-name" placeholder="Full Name (Max 16 chars)" maxlength="16">
      </div>
      <div class="form-row">
        <div class="form-group half">
          <label>Age</label>
          <input type="number" class="p-age" placeholder="Age" min="1" max="125">
        </div>
        <div class="form-group half">
          <label>Gender</label>
          <select class="p-gender">
            <option value="">Select</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="T">Transgender</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group half">
          <label>Berth Preference</label>
          <select class="p-berth">
            <option value="">No Preference</option>
            <option value="LB">Lower</option>
            <option value="MB">Middle</option>
            <option value="UB">Upper</option>
            <option value="SL">Side Lower</option>
            <option value="SU">Side Upper</option>
          </select>
        </div>
        <div class="form-group half">
          <label>Nationality</label>
          <select class="p-nationality" title="Nationality is typically IN for most bookings">
            <option value="IN">India</option>
          </select>
        </div>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
